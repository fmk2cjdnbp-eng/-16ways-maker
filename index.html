<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315CF6"><title>16通りメーカー</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:30px 22px 18px}h1{font-size:30px;margin:0 0 8px}.lead{font-size:17px;color:#68748a}main{max-width:760px;margin:auto;padding:0 18px 30px}.card{background:#fff;border-radius:24px;padding:18px;margin-bottom:14px}.group{border:2px solid #dce2ec;border-radius:22px;padding:16px;margin-bottom:14px}.group-title{font-size:22px;font-weight:700;margin-bottom:14px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pick{height:76px;border:2px solid #cfd6e2;border-radius:18px;background:#fff;font-size:30px;text-align:left;padding:0 22px}.empty{color:#9aa5b5}.primary{width:100%;height:62px;border:0;border-radius:20px;background:#315CF6;color:#fff;font-size:22px;font-weight:700}.reset{width:100%;height:52px;margin-top:10px;border:0;border-radius:16px;background:#edf1f7;font-size:17px}#results{margin-top:16px;display:grid;gap:8px}.result{padding:11px 14px;background:#f5f7fb;border-radius:12px;font-size:17px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 24px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:58px;border:0;border-radius:15px;background:#eef2f8;font-size:25px}.cancel{background:#f4dfe1}.clear{background:#e1e7f1}.hint{text-align:center;font-size:13px;color:#777;margin-top:10px}</style></head><body><header><h1>16通りメーカー</h1><p class="lead">4つの「2通り」を自由に組み合わせます。</p></header><main><div class="card" id="groups"></div><div class="card"><button class="primary" id="make">16通りを表示</button><button class="reset" id="reset">入力をリセット</button><div id="results"></div></div></main><div class="modal" id="modal"><div class="sheet"><h2 id="title">数字を選択</h2><div class="keys" id="keys"></div><div class="hint">0〜9をタッチして入力できます</div></div></div><script>
const groups=document.getElementById("groups"),modal=document.getElementById("modal"),keys=document.getElementById("keys");let active;
["①","②","③","④"].forEach((n,g)=>{let s=document.createElement("section");s.className="group";s.innerHTML='<div class="group-title">'+n+' 2通り</div><div class="inputs"></div>';let box=s.querySelector(".inputs");[0,1].forEach(x=>{let b=document.createElement("button");b.className="pick empty";b.textContent="タップ";b.dataset.value="";b.onclick=()=>open(b,g,x);box.appendChild(b)});groups.appendChild(s)});
function open(b,g,x){active=b;document.getElementById("title").textContent=(g+1)+"番目の「"+(x+1)+"つ目」";keys.innerHTML="";for(let n=0;n<10;n++){let k=document.createElement("button");k.className="key";k.textContent=n;k.onclick=()=>setv(n);keys.appendChild(k)}let c=document.createElement("button");c.className="key clear";c.textContent="消去";c.onclick=()=>setv("");keys.appendChild(c);let q=document.createElement("button");q.className="key cancel";q.textContent="閉じる";q.onclick=close;keys.appendChild(q);modal.classList.add("show")}
function setv(v){active.dataset.value=v;active.textContent=v===""?"タップ":v;active.classList.toggle("empty",v==="");close()}function close(){modal.classList.remove("show")}
document.getElementById("make").onclick=()=>{let v=[...document.querySelectorAll(".group")].map(s=>[...s.querySelectorAll(".pick")].map(b=>b.dataset.value));let r=document.getElementById("results");if(v.some(a=>a.some(x=>x===""))){r.innerHTML='<div class="result">8つすべての数字を入力してください。</div>';return}let o=[];for(let a of v[0])for(let b of v[1])for(let c of v[2])for(let d of v[3])o.push(a+" × "+b+" × "+c+" × "+d);r.innerHTML=o.map((x,i)=>'<div class="result">'+(i+1)+"．"+x+"</div>").join("")};
document.getElementById("reset").onclick=()=>{document.querySelectorAll(".pick").forEach(b=>{b.dataset.value="";b.textContent="タップ";b.classList.add("empty")});document.getElementById("results").innerHTML=""};</script></body></html>

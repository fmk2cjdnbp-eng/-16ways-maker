<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16通りメーカー</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6fb;color:#172033}main{max-width:560px;margin:auto;padding:20px 14px 40px}h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#667085}.group{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.gr{border:0;border-radius:9px;padding:8px 12px;background:#e8ecf5;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{min-height:58px;border:2px solid #d7ddea;border-radius:12px;background:#f8faff;font-size:24px;font-weight:700}.make{width:100%;margin-top:18px;border:0;border-radius:13px;padding:16px;background:#315cf6;color:#fff;font-size:19px;font-weight:700}.result{background:#fff;border-radius:12px;padding:10px;margin:7px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;padding:12px}.modal.show{display:flex}.pad{background:#fff;border-radius:22px;padding:14px;width:100%}.cur{text-align:center;margin:4px 0 12px;color:#667085}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{min-height:58px;border:0;border-radius:12px;background:#eef2f8;font-size:24px;font-weight:700}.clear{background:#ffe7e7}.close{background:#dfe5ef}</style></head>
<body><main><h1>16通りメーカー</h1><p class="sub">4つの「2通り」を数字タッチで入力</p><div id="groups"></div><button class="make" id="make">16通りを表示</button><div id="results"></div></main>
<div class="modal" id="modal"><div class="pad"><div class="cur" id="cur">数字を選択</div><div class="keys"><button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key clear">消去</button><button class="key">0</button><button class="key close">閉じる</button></div></div></div>
<script>
const G=document.getElementById("groups"),M=document.getElementById("modal"),C=document.getElementById("cur"),R=document.getElementById("results");let active=null;
for(let g=0;g<4;g++){let s=document.createElement("section");s.className="group";s.innerHTML='<div class="head"><b>'+(g+1)+'つ目</b><button class="gr">リセット</button></div><div class="row"></div>';let row=s.querySelector(".row");for(let c=0;c<2;c++){let b=document.createElement("button");b.className="pick";b.textContent="タップ";b.onclick=()=>{active=b;C.textContent=b.dataset.v?"現在："+b.dataset.v:"数字を選択";M.classList.add("show")};row.appendChild(b)}s.querySelector(".gr").onclick=()=>row.querySelectorAll(".pick").forEach(b=>{b.dataset.v="";b.textContent="タップ"});G.appendChild(s)}
document.querySelectorAll(".key").forEach(k=>k.onclick=()=>{if(!active)return;if(k.classList.contains("close"))return M.classList.remove("show");if(k.classList.contains("clear")){active.dataset.v="";active.textContent="タップ";C.textContent="数字を選択";return}active.dataset.v=k.textContent;active.textContent=k.textContent;M.classList.remove("show")});
document.getElementById("make").onclick=()=>{let v=[...G.querySelectorAll(".group")].map(s=>[...s.querySelectorAll(".pick")].map(b=>b.dataset.v||""));if(v.flat().some(x=>x===""))return alert("8個すべてに数字を入れてね");let o=[];for(let a of v[0])for(let b of v[1])for(let c of v[2])for(let d of v[3])o.push(a+" × "+b+" × "+c+" × "+d);R.innerHTML="<h2>16通り</h2>"+o.map((x,i)=>'<div class=result>'+(i+1)+". "+x+"</div>").join("")};
</script></body></html>

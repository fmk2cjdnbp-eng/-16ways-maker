<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315efb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="16通りメーカー">
<link rel="manifest" href="manifest.webmanifest">
<title>16通りメーカー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:620px;margin:auto;padding:22px 15px 38px}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 4px 18px #0000000b}
h1{font-size:27px;margin:4px 0}.lead{color:#667085;margin:5px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group{border:1px solid #dfe3ea;border-radius:14px;padding:12px}
label{display:block;font-weight:700;margin-bottom:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}
input{width:100%;height:46px;border:1px solid #ccd2dc;border-radius:11px;padding:0 10px;font-size:16px;outline:0}
input:focus{border-color:#315efb;box-shadow:0 0 0 3px #315efb20}
button{width:100%;min-height:46px;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}
.primary{background:#315efb;color:white}.secondary{background:#edf1f7;color:#26344d}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.count{color:#315efb;font-weight:800}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.item{padding:10px 6px;border:1px solid #e1e5ec;border-radius:10px;text-align:center;word-break:break-all;background:#fafbfc}
.note{font-size:13px;color:#667085;margin-top:10px}
@media(min-width:500px){.results{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>16通りメーカー</h1>
<p class="lead">4つの「2通り」を自由に組み合わせます。</p>
<section class="card">
<div class="grid">
<div class="group"><label>① 2通り</label><div class="pair"><input id="a1" value="A"><input id="b1" value="B"></div></div>
<div class="group"><label>② 2通り</label><div class="pair"><input id="a2" value="A"><input id="b2" value="B"></div></div>
<div class="group"><label>③ 2通り</label><div class="pair"><input id="a3" value="A"><input id="b3" value="B"></div></div>
<div class="group"><label>④ 2通り</label><div class="pair"><input id="a4" value="A"><input id="b4" value="B"></div></div>
</div>
<button class="primary" id="make">16通りを表示</button>
<button class="secondary" id="clear">リセット</button>
<p class="note">入力は文字・数字・記号など自由です。入力すると自動更新します。</p>
</section>
<section class="card">
<div class="head"><strong>組み合わせ一覧</strong><span class="count" id="count">16通り</span></div>
<div class="results" id="results"></div>
</section>
</main>
<script>
const ids=[['a1','b1'],['a2','b2'],['a3','b3'],['a4','b4']];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function generate(){
 const p=ids.map(x=>x.map(id=>document.getElementById(id).value));
 const out=[];
 for(const a of p[0])for(const b of p[1])for(const c of p[2])for(const d of p[3])out.push([a,b,c,d]);
 document.getElementById('results').innerHTML=out.map((r,i)=>`<div class="item">${i+1}. ${r.map(esc).join(' × ')}</div>`).join('');
 document.getElementById('count').textContent=out.length+'通り';
}
document.getElementById('make').onclick=generate;
document.getElementById('clear').onclick=()=>{ids.flat().forEach(id=>document.getElementById(id).value='');generate()};
ids.flat().forEach(id=>document.getElementById(id).addEventListener('input',generate));
generate();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
